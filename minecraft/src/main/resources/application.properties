spring.application.name=minecraft
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/entidades
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.jackson.deserialization.fail-on-missing-creator-properties=true
spring.jackson.deserialization.fail-on-null-creator-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
api.externa.base-url=https://api.restful-api.dev
api.externa.timeout-segundos=10
api.version=0.0.1-SNAPSHOT
# Compañeros del grupo POO-09 (A2 y A3), direcciones Tailscale. Se pueden pisar con variables de entorno.
